groups:
  - name: mdc-api
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '5xx error rate above 5%'
          description: 'More than 5% of HTTP requests returned 5xx in the last 5 minutes.'

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'p95 latency above 2s'
          description: 'p95 HTTP latency is above 2 seconds for 5 minutes.'

  - name: mdc-outbox
    interval: 30s
    rules:
      - alert: OutboxBacklog
        expr: outbox_events_pending > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox backlog above 1000 events'
          description: 'Outbox events have been accumulating for 10 minutes.'

      - alert: OutboxDeadLetterSpike
        expr: |
          sum(rate(outbox_events_total{status="dead_lettered"}[5m])) > 10 / 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Outbox dead-letter spike'
          description: 'More than 10 outbox events have been dead-lettered in the last 5 minutes.'

  - name: mdc-business
    interval: 1m
    rules:
      - alert: DsrSlaBreach
        expr: |
          increase(dsr_requests_total{status=~"PENDING|IN_PROGRESS"}[1h]) > 0
            and on()
          (hour() >= 0)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'DSR SLA risk'
          description: 'Investigate DSR requests nearing the 30-day SLA.'

      - alert: PaymentFailureRate
        expr: |
          sum(rate(outbox_events_total{event_type="InvoicePaymentFailed"}[15m])) > 3 / 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Payment failure rate elevated'
          description: 'More than 3 payment failures observed in the last 15 minutes.'

  - name: mdc-storage
    interval: 5m
    rules:
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Disk space below 10%'
          description: 'Root filesystem has less than 10% free space.'
