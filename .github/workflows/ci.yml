name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000
      BODY_JSON_LIMIT: 1mb
      BODY_URLENCODED_LIMIT: 1mb
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mdc_test?schema=public
      REDIS_URL: redis://localhost:6379
      HEALTH_DATABASE_TIMEOUT_MS: 5000
      HEALTH_REDIS_TIMEOUT_MS: 5000
      MDC_E2E_TESTCONTAINERS: true
      # S3 / MinIO
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: mdc-test
      S3_FORCE_PATH_STYLE: true
      HEALTH_S3_TIMEOUT_MS: 5000
      # Elasticsearch
      ELASTICSEARCH_NODE: http://localhost:9200
      HEALTH_ELASTICSEARCH_TIMEOUT_MS: 5000
      # SMTP / MailHog
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_USER: test
      SMTP_PASS: test
      EMAIL_FROM: test@mdc.local
      HEALTH_MAILER_TIMEOUT_MS: 5000
      # OpenTelemetry
      OTEL_SERVICE_NAME: mdc-be-ci
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      # Process role
      APP_PROCESS_ROLE: all
      # Auth secrets
      JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: test-cookie-secret-min-32-chars-long
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: lax
      BILLING_WEBHOOK_SECRET: test-billing-webhook-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Fallow audit (changed files only)
        run: npm run fallow:audit:diff

      - name: Build application
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

  container-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mdc-be:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
